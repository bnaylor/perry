providers:
  - name: local-cuda
    type: ollama
    base_url: "http://10.3.2.8:11434" # Node 1 (diffuser/4070 Ti)
  - name: local-npu
    type: ollama
    base_url: "http://10.3.2.48:11434" # Node 2 (mink/4060 Ti)
  - name: cloud-anthropic
    type: anthropic
    api_key_env: "ANTHROPIC_API_KEY"
  - name: cloud-gemini
    type: google
    api_key_env: "GEMINI_API_KEY"

defaults:
  strategist:
    tier: cloud
    provider: cloud-gemini
    model: "gemini-3.1-flash-lite"
  researcher:
    tier: cloud
    provider: cloud-gemini
    model: "gemini-3.1-flash-lite"
  coder:
    tier: local
    provider: local-cuda
    model: "qwen3:14b"
  auditor_semantic:
    tier: local
    provider: local-cuda
    model: "qwen2.5-coder:14b"
  auditor_shadow:
    tier: local
    provider: local-npu
    model: "deepseek-r1:14b"

escalation:
  max_local_attempts: 2
  promote_to:
    tier: cloud
    provider: cloud-gemini
    model: "gemini-3.1-pro-preview"

fallback:
  tier: local
  provider: local-cuda
  model: "qwen3:14b"
